name: DeporiaQ Windows Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Yayın sürümü (örnek: 0.23.0)"
        required: true
        default: "0.23.0"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-2022
    steps:
      - name: Kaynakları al
        uses: actions/checkout@v5

      - name: Python 3.12 hazırla
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Derleme araçlarını kur
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6==6.11.2 ttkbootstrap==2.2.3 "pyinstaller>=6.9,<7" psutil==7.2.2 pytest==9.1.1
          if ($LASTEXITCODE -ne 0) { throw "Python bağımlılıkları kurulamadı." }
          choco install innosetup -y --no-progress

      - name: Sürüm tutarlılığını doğrula
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          if ((Get-Content deporiaq_qt.py -Raw) -notmatch ('SURUM = "' + [regex]::Escape($version) + '"')) {
            throw "deporiaq_qt.py sürümü ile yayın sürümü uyuşmuyor."
          }

      - name: Qt arka plan ve görünürlük testini çalıştır
        shell: pwsh
        run: |
          python tests/test_dashboard.py test-results
          if ($LASTEXITCODE -ne 0) { throw "Qt çizim testi başarısız; yayın durduruldu." }

      - name: Operasyon Merkezi ve başlangıç sözleşmesi testleri
        shell: pwsh
        run: |
          python -m pytest tests/test_analysis.py tests/test_runtime.py tests/test_operations_ui.py -q
          if ($LASTEXITCODE -ne 0) { throw "0.23.0 işlev testleri başarısız." }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'deporiaq_restart.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }

      - name: Cloud istemci yapılandırmasını hazırla
        shell: pwsh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SUPABASE_URL)) { throw "SUPABASE_URL secret tanımlı değil." }
          if ([string]::IsNullOrWhiteSpace($env:SUPABASE_PUBLISHABLE_KEY)) { throw "SUPABASE_PUBLISHABLE_KEY secret tanımlı değil." }
          if ($env:SUPABASE_PUBLISHABLE_KEY -match "service_role|sb_secret_") { throw "Secret/service_role anahtarı masaüstü uygulamasına gömülemez." }
          [ordered]@{
            project_url = $env:SUPABASE_URL.TrimEnd('/')
            publishable_key = $env:SUPABASE_PUBLISHABLE_KEY
          } | ConvertTo-Json | Set-Content deporiaq_cloud.json -Encoding utf8

      - name: Windows uygulamalarını oluştur
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --icon deporiaq_icon.ico --add-data "deporiaq_icon.svg;." --add-data "youtube_icon.svg;." --add-data "instagram_icon.svg;." --add-data "dashboard_background.jpg;." --add-data "deporiaq_cloud.json;." --collect-all ttkbootstrap --name DeporiaQ deporiaq_qt.py
          if ($LASTEXITCODE -ne 0) { throw "DeporiaQ derlenemedi." }
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name DeporiaQUpdate deporiaq_guncelleme_bildirici.py
          if ($LASTEXITCODE -ne 0) { throw "Güncelleyici derlenemedi." }
          python -m PyInstaller --noconfirm --clean --onefile --windowed --paths tests/fixtures --distpath test-old-dist --workpath test-old-build --specpath tests --name DeporiaQUpdate tests/legacy_update_driver.py
          if ($LASTEXITCODE -ne 0) { throw "0.22.4 geçiş testi aracı derlenemedi." }

      - name: Kurulum dosyasını oluştur
        shell: pwsh
        run: |
          python tests/test_bundle.py
          if ($LASTEXITCODE -ne 0) { throw "EXE görsel içeriği doğrulanamadı." }
          if ((Get-Content DeporiaQ.iss -Raw) -match 'InitializeSetup') {
            throw "Kurulumu görünmeden kapatan InitializeSetup kodu yeniden eklenemez."
          }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" DeporiaQ.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup derlenemedi." }

      - name: Windows Server 2022 gerçek kurulum ve eski güncelleyici geçiş testi
        timeout-minutes: 10
        shell: pwsh
        run: |
          python tests/test_windows_install.py
          if ($LASTEXITCODE -ne 0) { throw "Otomatik açılma testi başarısız; yayın durduruldu." }

      - name: Test günlüklerini ve ekran görüntülerini sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DeporiaQ-0.23.0-test-results
          path: test-results/
          if-no-files-found: warn

      - name: Güncelleme manifestini üret
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          $setup = "kurulum\DeporiaQ_Setup_$version.exe"
          if (-not (Test-Path $setup)) { throw "Kurulum dosyası oluşmadı: $setup" }
          $sha = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            version = $version
            download_url = "https://github.com/${{ github.repository }}/releases/download/v$version/DeporiaQ_Setup_$version.exe"
            sha256 = $sha
            notes = "Bağımsız ve açılış onaylı güncelleme başlatıcısı, 9 operasyon analizi ve Ctrl+K hızlı komut menüsü."
          }
          $manifest | ConvertTo-Json | Set-Content guncelleme_manifest.json -Encoding utf8

      - name: GitHub Release oluştur
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ inputs.version }}"
          gh release create "v$version" "kurulum\DeporiaQ_Setup_$version.exe" guncelleme_manifest.json --title "DeporiaQ $version" --notes-file DEPORIAQ_0.23.0_YAYIN_NOTU.txt

      - name: Manifesti ana dala gönder
        shell: pwsh
        run: |
          Copy-Item guncelleme_manifest.json "$env:RUNNER_TEMP\guncelleme_manifest.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          Copy-Item "$env:RUNNER_TEMP\guncelleme_manifest.json" guncelleme_manifest.json
          git add guncelleme_manifest.json
          git commit -m "DeporiaQ ${{ inputs.version }} güncelleme manifesti" || echo "Manifest değişmedi"
          git push origin main
