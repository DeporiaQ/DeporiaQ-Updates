name: DeporiaQ 0.26 Server Readiness
on:
  workflow_dispatch:
  push:
    branches: ['codex/deporiaq-0.26.0']
    paths: ['.github/workflows/deploy-0260-assistant.yml', 'server/ACTIVATE_ASSISTANT_0260']
permissions:
  contents: read
jobs:
  verify-server:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify SQL 0.26 for search and owner-only rename
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.parse
          base=os.environ['SUPABASE_URL'].rstrip('/')
          if not (urllib.parse.urlparse(base).hostname or '').endswith('.supabase.co'):
              raise SystemExit('Invalid project URL')
          request=urllib.request.Request(base+'/rest/v1/rpc/dpq_0260_ready',data=b'{}',headers={'apikey':os.environ['SUPABASE_PUBLISHABLE_KEY'],'Content-Type':'application/json'})
          try:
              with urllib.request.urlopen(request,timeout=20) as response:version=json.load(response)
          except Exception:raise SystemExit('SQL 0.26 could not be verified. No server changes were made.')
          if version!='0.26.0':raise SystemExit('SQL 0.26 is required before release.')
          print('SQL 0.26.0 verified. Assistant is an offline guide; no AI key, provider request or deployment is used.')
          PY
