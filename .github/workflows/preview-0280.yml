name: DeporiaQ 0.28.1 Retail Preview Validation
on:
  push:
    branches: ['codex/deporiaq-0.28.1']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install PySide6==6.11.2 ttkbootstrap==2.2.3 pytest==9.1.1 reportlab==4.4.9 openpyxl==3.1.5 Pillow==12.3.0 psutil==7.2.2 tzdata==2025.2
      - run: python -m pytest tests --ignore=tests/test_bundle.py -q --junitxml=test-results/0280-unit.xml
      - name: Render native 3D warehouse and checkout
        run: python tools/render_workspace_0281.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DeporiaQ-0280-native-review
          path: test-results/
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-not-production
          POSTGRES_DB: deporiaq_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DPQ_TEST_DATABASE_URL: postgres://postgres:test-only-not-production@localhost:5432/deporiaq_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: node tests/server/retail.mjs
