name: Validate and publish DeporiaQ 0.25.0
on:
  push:
    branches: ['codex/deporiaq-0.25.0']
    paths: ['.github/workflows/release-0250.yml']
concurrency:
  group: release-0250
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: DeporiaQ/DeporiaQ-Updates
    steps:
      - name: Wait for exact source build and tests
        run: |
          set -euo pipefail
          for run in 38620599009 38620598367 38620598895; do
            test "$(gh api "repos/$GH_REPO/actions/runs/$run" --jq .head_sha)" = 739b3e7f210349cb803677bb8a5d1339f14ba443
            gh run watch "$run" --exit-status --interval 30
          done
  defender:
    needs: gates
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Download exact previously built artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory evidence,package | Out-Null
          $artifacts = gh api repos/DeporiaQ/DeporiaQ-Updates/actions/runs/38620599009/artifacts | ConvertFrom-Json
          $artifact = $artifacts.artifacts | Where-Object name -eq 'DeporiaQ-0.25.0-candidate-setup'
          if (-not $artifact.id -or $artifact.expired) { throw "Verified artifact unavailable" }
          gh api "repos/DeporiaQ/DeporiaQ-Updates/actions/artifacts/$($artifact.id)/zip" > candidate.zip
          if ($LASTEXITCODE -ne 0) { throw "Artifact download failed" }
          $hash = (Get-FileHash candidate.zip -Algorithm SHA256).Hash.ToLower()
          if ("sha256:$hash" -ne $artifact.digest) { throw "Artifact digest mismatch" }
          Expand-Archive candidate.zip package
          Get-ChildItem package -Recurse -File | Get-FileHash -Algorithm SHA256 | Format-List | Out-File evidence/hashes.txt
          Get-Content evidence/hashes.txt
          Get-ChildItem package -Recurse -Filter *.exe | Get-AuthenticodeSignature | Select-Object Path,Status,StatusMessage | ConvertTo-Json | Tee-Object evidence/signatures.json
      - name: Update and run Microsoft Defender
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Get-Service WinDefend | Format-List
          Start-Service WinDefend
          Update-MpSignature
          $status = Get-MpComputerStatus
          $status | Select-Object AMServiceEnabled,AntivirusEnabled,AMRunningMode,AntivirusSignatureVersion,AntivirusSignatureLastUpdated | ConvertTo-Json | Tee-Object evidence/defender-status.json
          if (-not $status.AMServiceEnabled -or -not $status.AntivirusEnabled) { throw "Defender unavailable; no clean verdict" }
          $cmd = Get-ChildItem "$env:ProgramData/Microsoft/Windows Defender/Platform/*/MpCmdRun.exe" | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $cmd) { $cmd = "$env:ProgramFiles/Windows Defender/MpCmdRun.exe" }
          & $cmd -Scan -ScanType 3 -File "$PWD/package" -DisableRemediation 2>&1 | Tee-Object evidence/defender-scan.txt
          $scanExit = $LASTEXITCODE
          Get-MpThreatDetection | ConvertTo-Json -Depth 6 | Out-File evidence/detections.json
          "Defender scan exit code: $scanExit" | Tee-Object -Append evidence/defender-scan.txt
          if ($scanExit -ne 0) { throw "Defender did not return a clean scan; inspect evidence" }
      - name: Inspect installed payload on isolated runner
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "DeporiaQ Security Inspection"
          $process = Start-Process "$PWD/package/DeporiaQ_Setup_0.25.0.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$stage`"" -PassThru
          if (-not $process.WaitForExit(180000)) { throw "Installer did not exit within 180 seconds" }
          if ($process.ExitCode -ne 0) { throw "Isolated installation failed" }
          $cmd = Get-ChildItem "$env:ProgramData/Microsoft/Windows Defender/Platform/*/MpCmdRun.exe" | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          & $cmd -Scan -ScanType 3 -File $stage -DisableRemediation 2>&1 | Tee-Object evidence/defender-payload.txt
          if ($LASTEXITCODE -ne 0) { throw "Payload scan failed" }
          Get-ChildItem $stage -Recurse -File | Get-FileHash -Algorithm SHA256 | Format-List | Out-File evidence/payload-hashes.txt
          Copy-Item $stage extracted -Recurse
      - uses: actions/upload-artifact@v4
        with:
          name: inspected-installed-payload
          path: extracted/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-security-evidence
          path: evidence/

  clamav:
    needs: defender
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: inspected-installed-payload
          path: extracted/
      - name: Install and update scanner
        run: |
          mkdir evidence
          sudo apt-get update -qq
          sudo apt-get install -y clamav
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam
      - name: Scan installed payload with ClamAV
        run: |
          clamscan --version | tee evidence/scanner-version.txt
          find extracted -type f -exec sha256sum {} + > evidence/files-sha256.txt
          set -o pipefail
          clamscan --recursive --max-filesize=200M --max-scansize=600M extracted | tee evidence/clamav.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-clamav-evidence
          path: evidence/

  publish:
    needs: [gates, defender, clamav]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: DeporiaQ/DeporiaQ-Updates
    steps:
      - name: Download tested and scanned installer
        run: |
          set -euo pipefail
          gh api repos/$GH_REPO/actions/runs/38620599009/artifacts > artifacts.json
          id=$(jq -r '.artifacts[] | select(.name=="DeporiaQ-0.25.0-candidate-setup" and .expired==false) | .id' artifacts.json)
          digest=$(jq -r '.artifacts[] | select(.name=="DeporiaQ-0.25.0-candidate-setup" and .expired==false) | .digest' artifacts.json)
          test -n "$id"
          gh api "repos/$GH_REPO/actions/artifacts/$id/zip" > candidate.zip
          echo "${digest#sha256:}  candidate.zip" | sha256sum -c -
          unzip candidate.zip
          sha256sum DeporiaQ_Setup_0.25.0.exe > SHA256SUMS.txt
      - name: Publish release
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          # DeporiaQ 0.25.0
          
          Windows kurulum, açık uygulamada güncelleme ve otomatik yeniden açılma testlerinden geçen sürüm.
          
          ## Mevcut ekran düzeltmeleri
          - Paketlerde “Yönetici dahil” ifadesi.
          - Eşit boyutlu sosyal düğmeler, WhatsApp ve X ikonları; X yalnız ikon.
          - Alt ekrandan kapanınca ilgili menüye dönüş; ana pencereyi engellemeyen iş ekranları.
          - Ortak açılır oklar, rapora uygun tarih alanları.
          - Cihaz envanterinden ayrı kullanıcı oturumu, 10 saniyelik yoklama ve 30 saniyelik bağlantı kaybı süresi.
          - Beş standart arka plan ve özel görsel seçimi.
          - Sunucudan doğrudan destek e-postası ve talep durumu ekranı. Edge Function kurulumu gerektirir.
          
          ## Son dört arayüz isteği
          - Profil yanında abonelik durumu, 30 dakikalık doğrulama; geçici bağlantı hatası ayrı gösterilir.
          - Sol altta bağlantısız destek e-postası.
          - Zil, okunmamış sayı, sarı hareketli bildirim çerçevesi ve kullanıcıya özel geçmiş.
          - Kapatılabilir açılış/kapanış logo animasyonu.
          
          ## Yirmi geliştirme
          1. Tek işlemde çok ürünlü satış sepeti.
          2. Sunucuda bekletilen satış sepetleri (stok ayırmaz).
          3. Nakit, kart ve bölünmüş ödeme kaydı (banka/POS entegrasyonu değildir).
          4. Personel indirim sınırı ve tek sepete bağlı, 15 dakikalık yönetici onayı.
          5. Ürün görselleri.
          6. Kategori, etiket, yazar/marka ve yayınevi/üretici alanları ve arama.
          7. Varyant grubu ve varyant değeri ile ürünleri bulma.
          8. Set bileşenlerini sepete ekleme ve atomik stok düşümü.
          9. Raf/koridor adresi ve arama.
          10. Code128 barkodlu PDF raf etiketi.
          11. Tedarikçi kartları.
          12. Tedarikçiye bağlı satın alma siparişleri.
          13. Sağlam/hasarlı teslim, önceki teslim ve kalan adet farkları.
          14. Satılabilir stoktan ayrı hasarlı ürün kayıtları.
          15. Ürüne bağlı parti numarası ve son kullanma tarihi kayıtları; otomatik FEFO tahsisi değildir.
          16. Excel/CSV sütun eşleştirme, barkod ve sayı doğrulama, önizlemeli toplu ürün ekleme.
          17. Eski fiyatı doğrulayan toplu fiyat önizlemesi.
          18. İşletme üyelerine atanabilen görevler ve durum takibi.
          19. Ana sayfa özet kartlarının sırası ve görünürlüğü.
          20. Yeni veri giriş ekranlarında kaydedilmemiş değişiklik göstergesi ve çıkış seçenekleri.
          
          ## Sunucu kurulumu
          1. Mevcut 0.24.1 veya üzeri sunucuya `DEPORIAQ_CLOUD_0.25.0_UPDATE.sql` uygulanır.
          2. SQL sonucu `installed_version = 0.25.0` olmalı. Geçiş abonelik tarihlerini veya mevcut stokları değiştirmez.
          3. Destek e-postası için GitHub Actions secrets alanında `SUPABASE_ACCESS_TOKEN` gerekir. Mevcut `DPQ_SMTP_PASSWORD` sunucu sırrı olarak aktarılır, istemciye eklenmez.
          4. `DeporiaQ 0.25 Support Deployment` çalıştırılır. Gerçek bir talepte SMTP kabulü ayrıca doğrulanır.
          5. Windows kurulum/açık uygulama yükseltmesi ve güvenlik taramaları başarılı olduktan sonra sürüm ve güncelleme manifesti yayınlanır.
          
          ## Doğrulama
          Yayın yapılan projede 0.25.0 SQL geçişi ve destek işlevi kurulumu doğrulandı. Gerçek destek e-postasının gelen kutusuna ulaşması ayrıca test edilmelidir.
          NOTES
          gh release create v0.25.0 DeporiaQ_Setup_0.25.0.exe SHA256SUMS.txt --target 739b3e7f210349cb803677bb8a5d1339f14ba443 --title 'DeporiaQ 0.25.0' --notes-file release-notes.md --latest
      - name: Enable normal in-app update using optimistic file revision
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/contents/guncelleme_manifest.json?ref=main" > current-manifest.json
          python - <<'PY'
          import base64,hashlib,json
          from pathlib import Path
          current=json.loads(Path('current-manifest.json').read_text())
          old=json.loads(base64.b64decode(current['content']))
          if tuple(map(int,old['version'].split('.'))) >= (0,25,0):
              raise SystemExit('A newer or equal manifest exists; refusing to overwrite')
          manifest={
              'version':'0.25.0',
              'download_url':'https://github.com/DeporiaQ/DeporiaQ-Updates/releases/download/v0.25.0/DeporiaQ_Setup_0.25.0.exe',
              'sha256':hashlib.sha256(Path('DeporiaQ_Setup_0.25.0.exe').read_bytes()).hexdigest(),
              'notes':'Yeni satış sepeti, satın alma ve tedarikçi yönetimi, ürün içe aktarma, görevler, bildirimler ve görünüm geliştirmeleri. 0.25.0 SQL geçişi gerektirir; bu projede tamamlandı.'
          }
          payload={'message':'Publish verified 0.25.0 in-app update','branch':'main','sha':current['sha'],
                   'content':base64.b64encode((json.dumps(manifest,ensure_ascii=False,indent=2)+'\n').encode()).decode()}
          Path('manifest-update.json').write_text(json.dumps(payload))
          PY
          gh api "repos/$GH_REPO/contents/guncelleme_manifest.json" -X PUT --input manifest-update.json --silent
