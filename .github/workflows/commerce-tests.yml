name: DeporiaQ Commerce Tests
on:
  workflow_dispatch:
  push:
    paths:
      - 'server/**'
      - 'tests/**'
      - 'deporiaq_commerce*.py'
      - '.github/workflows/commerce-tests.yml'
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-not-production
          POSTGRES_DB: deporiaq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DPQ_TEST_DATABASE_URL: postgres://postgres:test-only-not-production@localhost:5432/deporiaq_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run test:server
      - run: npm run test:concurrency
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commerce-postgres-evidence
          path: test-results/
  python:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install PySide6==6.11.2 ttkbootstrap==2.2.3 pytest==9.1.1
      - run: python -m pytest tests/test_analysis.py tests/test_runtime.py tests/test_operations_ui.py tests/test_commerce_client.py tests/test_commerce_cache.py tests/test_commerce_ui.py tests/test_support_worker.py tests/test_config_security.py -q --junitxml=test-results/windows-unit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commerce-windows-ui-evidence
          path: test-results/
